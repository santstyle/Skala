[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "skala"
version = "0.1.0"
description = "Skala - cross-platform image and video upscaler (2x-8x) wrapping open-source engines"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Skala contributors" }]
keywords = ["upscale", "super-resolution", "realesrgan", "image", "video", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Graphics",
    "Topic :: Multimedia :: Video",
]
dependencies = [
    "typer>=0.12",
    "pillow>=10.0",
    "tqdm>=4.66",
    # tomllib is stdlib from 3.11; tomli is its backport for 3.10 only.
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    # Present on 3.11+ dev machines so mypy (python_version = 3.10) can resolve
    # the `tomli` fallback import in skala/config.py.
    "tomli>=2.0",
]

[project.scripts]
skala = "skala.cli:main"

[project.urls]
Homepage = "https://github.com/santstyle/Skala"

[tool.setuptools.packages.find]
include = ["skala*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["skala", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # bugbear
    "SIM", # simplify
    "C4",  # comprehensions
    "PTH", # pathlib
    "RUF", # ruff-specific
]
ignore = [
    "SIM108", # ternary is not always clearer
    "B008",   # Typer Depends() uses function calls in defaults by design
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["SIM117"]

[tool.mypy]
python_version = "3.10"
files = ["skala", "tests"]
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
no_implicit_optional = true
check_untyped_defs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
